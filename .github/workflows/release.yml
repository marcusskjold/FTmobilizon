name: Build Mobilizon Release

on:
  push:
    branches: [ftdev]
    tags: ["v*"]

env:
  MIX_ENV: prod

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.15"
          otp-version: "26"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl unzip openssl git cmake file

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Restore Mix deps cache
        uses: actions/cache@v4
        with:
          path: |
            deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore Node modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get

      - name: Compile
        run: mix compile --force

      - name: Build assets
        run: |
          npm install
          npm run build

      - name: Create a digest of the static assets
        run: mix phx.digest

      - name: Clean previous release
        run: rm -rf _build/prod/rel/mobilizon

      - name: Build release
        run: mix release

      - name: Set release filename
        id: vars
        run: |
          VERSION=$(grep '@version ' mix.exs | head -1 | sed 's/.*"\(.*\)".*/\1/')
          REF=${GITHUB_REF_NAME}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            FILENAME="mobilizon-${REF}.tar.gz"
          else
            SHORT_SHA=${GITHUB_SHA::7}
            FILENAME="mobilizon-${VERSION}-ftdev-${SHORT_SHA}.tar.gz"
          fi
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package release
        run: |
          cd _build/prod/rel
          tar czf ${{ steps.vars.outputs.filename }} mobilizon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilizon-release
          path: _build/prod/rel/${{ steps.vars.outputs.filename }}

      - name: Save artifact for host
        run: |
          mkdir -p .artifacts
          cp _build/prod/rel/${{ steps.vars.outputs.filename }} .artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _build/prod/rel/${{ steps.vars.outputs.filename }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

